services:
  - type: web
    name: leaddesk-mini-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: e.g. mongodb+srv://user:pass@cluster.mongodb.net/leaddesk
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a cryptographically secure 256-bit key
      - key: ADMIN_EMAIL
        value: admin@leaddesk.com
      - key: ADMIN_SEED_PASSWORD
        sync: false # Set in Render Dashboard: e.g. StrongAdminPassword2026!
